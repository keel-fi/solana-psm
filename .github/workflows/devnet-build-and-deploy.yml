name: Devnet Build and Prepare Release
# Writes the verifiable build to a newly created program buffer.
# This does NOT upgrade the program, but instead stages the program
# in buffer ready for upgrade by the ultimate upgrade authority.

on:
  push:
    tags:
      - "devnet-v*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Always run from the program's directory within the monorepo
defaults:
  run:
    working-directory: ./program

jobs:
  security_audit:
    name: security_audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
      - run: cargo audit --ignore RUSTSEC-2022-0093 --ignore RUSTSEC-2023-0065 --ignore RUSTSEC-2024-0344 --ignore RUSTSEC-2024-0421

  verified_build:
    name: verified_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install solana-verify dependencies
        run: sudo apt-get install libudev-dev
      - name: Pull solana-verifiable-build Docker image
        run: docker pull --platform linux/amd64 solanafoundation/solana-verifiable-build:2.1.13
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install solana-verify from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: solana-verify
      - name: Build psm with verifiable build
        run: solana-verify build --library-name solana-psm --base-image solanafoundation/solana-verifiable-build:2.1.13
        # step successfully builds, but errors parsing output.
        # We should continue to attempt to upload the artifact.
        continue-on-error: true
      - name: Test 0
        run: pwd
      - name: Test 1
        run: ls
      - name: Test 2
        run: ls ./target
      - name: Test 2
        run: ls -lh ./target/deploy
      - name: Move build file
        run: mv ./target/deploy/solana_psm.so ./solana_psm.so
      - name: Upload psm
        uses: actions/upload-artifact@v4
        with:
          name: solana_psm.so
          path: ./solana_psm.so

  test_build:
    name: Test verifiable build
    runs-on: ubuntu-latest
    needs:
      - verified_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: solana_psm.so
          path: ./target/deploy
      - name: Test verifiable build
        run: cargo test-sbf

  # release only runs on tagged commits
  # it should wait for all the other steps to finish, to ensure releases are the highest quality
  # after waiting, it will download the verified build and IDL from the verified_build step and release the artifacts
  release:
    name: release
    runs-on: ubuntu-latest
    environment: devnet
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs:
      - test_build
      - security_audit
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: solana_psm.so
      - name: Download Solana CLI
        run: sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
      - name: Add Solana CLI to path
        run: echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Create temporary hot wallet keypair
        run: echo "${{ secrets.HOT_WALLET }}" > hot_wallet.json
      - name: Attempt to airdrop Devnet Sol to hot wallet
        run: solana airdrop 5 $(solana-keygen pubkey ./hot_wallet.json) --url devnet
        continue-on-error: true # ignore errors
      - name: Create program buffer keypair
        id: create-program-buffer
        run: |
          solana-keygen new --no-passphrase -o buffer.json && \
          echo "buffer-key=$(solana-keygen pubkey ./buffer.json)" >> "$GITHUB_OUTPUT"
      - name: Write program to new buffer
        run: solana program write-buffer ./solana_psm.so --buffer ./buffer.json --buffer-authority ./hot_wallet.json --url ${{ vars.RPC_URL || 'devnet' }} --keypair ./hot_wallet.json
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: |
            Program buffer: ${{ steps.create-program-buffer.outputs.buffer-key }}
          files: |
            solana_psm.so
